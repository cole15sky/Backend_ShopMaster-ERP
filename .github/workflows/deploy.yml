name: Shopmaster ERP CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/backend_shopmaster_erp:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/backend_shopmaster_erp:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            IMAGE="ghcr.io/${{ secrets.GHCR_USERNAME }}/backend_shopmaster_erp:latest"
            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            echo "📦 Pulling image..."
            docker pull $IMAGE

            echo "🧹 Removing old container..."
            docker rm -f shopmaster_erp || true

            echo "🚀 Starting container..."
            docker run -d \
              --name shopmaster_erp \
              -p 8001:8000 \
              --restart unless-stopped \
              --env-file /home/ubuntu/shopmaster/.env \
              $IMAGE

            echo "✅ Deployed successfully"