name: Shopmaster ERP Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Shopmaster ERP to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "🚀 Deploying Shopmaster ERP (separate app)..."

            IMAGE="ghcr.io/${{ secrets.GHCR_USERNAME }}/backend_shopmaster_erp:latest"

            echo "📦 Pulling latest image..."
            docker pull $IMAGE

            echo "🧹 Removing old Shopmaster container only..."
            docker rm -f shopmaster_erp || true

            echo "🚀 Starting Shopmaster ERP on NEW PORT 8001..."
            docker run -d \
              --name shopmaster_erp \
              -p 8001:8000 \
              --restart unless-stopped \
              --env-file /home/ubuntu/shopmaster/.env \
              $IMAGE

            echo "⏳ Verifying deployment..."
            sleep 5
            docker ps | grep shopmaster_erp

            echo "✅ Shopmaster ERP deployed successfully on port 8001 🚀"