version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopmaster_erp
    restart: always

    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3

    env_file:
      - .env

    volumes:
      - .:/app
      - shopmaster_erp_media_data:/app/media
      - shopmaster_erp_static:/app/static
      - shopmaster_erp_data:/app/data

    ports:
      - "8000:8000"
