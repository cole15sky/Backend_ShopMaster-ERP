version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopmaster_erp
    restart: always

    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4

    env_file:
      - .env

    volumes:
      - shopmaster_erp_media_data:/app/media
      - shopmaster_erp_static:/app/static

    ports:
      - "8000:8000"

volumes:
  shopmaster_erp_media_data:
  shopmaster_erp_static: